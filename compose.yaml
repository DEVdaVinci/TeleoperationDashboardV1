name: teleoperation-dashboard-v1

services:
  backend:
    build: ./teleop_backend_v1
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./teleop_backend_v1:/app
    env_file:
      - ./teleop_backend_v1/.env

  robot:
    build: ./teleop_robot_v1
    init: true
    volumes:
      - ./teleop_robot_v1:/app
    env_file:
      - ./teleop_robot_v1/.env
    depends_on:
      - backend

  frontend:
    image: node:26-slim
    init: true
    working_dir: /app
    command:
      - sh
      - -c
      - npm ci --prefer-offline --no-audit --no-fund && exec npm run dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./teleop_frontend_v1:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/root/.npm
    env_file:
      - ./teleop_frontend_v1/.env
    depends_on:
      - backend

volumes:
  frontend_node_modules:
  frontend_npm_cache:
